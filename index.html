<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VACUNA//60</title><style>html,body{margin:0;min-height:100%;background:#07111f;color:#eef6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.box{max-width:520px}.spin{width:42px;height:42px;border:4px solid #20364a;border-top-color:#35d6c6;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{padding:12px 16px;border:0;border-radius:12px;background:#35d6c6;color:#041117;font-weight:800}</style></head><body><div class="load"><div class="box"><div class="spin"></div><h1>Cargando VACUNA//60…</h1><p id="msg">Preparando la aplicación.</p><button id="retry" hidden>Reintentar</button></div></div><script>const url='https://raw.githubusercontent.com/Peter24a/ApuntesClase/main/VACUNA60/index.html';async function boot(){try{const r=await fetch(url+'?v='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);const h=await r.text();document.open();document.write(h);document.close()}catch(e){document.getElementById('msg').textContent='No se pudo cargar. Revisa tu conexión y toca Reintentar.';document.getElementById('retry').hidden=false}}document.getElementById('retry').onclick=boot;boot();</script></body></html>
